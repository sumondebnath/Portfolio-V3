<!doctype html>
<html lang="en" style="background: #0e1b2a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1b2a" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | Sumon Debnath</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: #0e1b2a;
        color: #e0f7fa;
        font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
      }
      .card {
        width: 100%;
        max-width: 28rem;
        padding: 2rem 1.5rem;
        border: 1px solid rgba(224, 247, 250, 0.14);
        border-radius: 1rem;
        background: rgba(224, 247, 250, 0.03);
        text-align: center;
      }
      .badge {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.375rem 0.75rem;
        border: 1px solid rgba(224, 247, 250, 0.08);
        border-radius: 9999px;
        background: rgba(224, 247, 250, 0.05);
        color: rgba(224, 247, 250, 0.65);
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.04em;
      }
      h1 {
        margin: 0;
        font-size: 1.75rem;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0.75rem auto 0;
        max-width: 22rem;
        color: rgba(224, 247, 250, 0.65);
      }
      a.home {
        display: inline-flex;
        align-items: center;
        margin-top: 1.5rem;
        padding: 0.625rem 1.5rem;
        border-radius: 0.5rem;
        background: linear-gradient(135deg, #5eead4, #14b8a6);
        box-shadow: 0 20px 40px -15px rgba(94, 234, 212, 0.4);
        color: #0e1b2a;
        font-size: 0.8125rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 200ms ease;
      }
      a.home:hover { transform: scale(1.02); }
      a:focus-visible {
        outline: 2px solid #5eead4;
        outline-offset: 2px;
        border-radius: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        a.home { transition: none; }
        a.home:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <span class="badge">404</span>
        <h1>Page not found</h1>
        <p>That page doesn't exist. The portfolio home is just one click away.</p>
        <a class="home" href="/">Back to home</a>
      </div>
    </main>
  </body>
</html>
